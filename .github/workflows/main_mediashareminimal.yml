name: Build and deploy Node.js app to Azure Web App - mediashareminimal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Prepare Package
        run: |
          mkdir -p output
          # Copy standalone server and its node_modules
          cp -r .next/standalone/. output/
          # Copy static and public assets
          mkdir -p output/.next/static
          cp -r .next/static/. output/.next/static/
          cp -r public output/public

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: output
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy-package # ✅ Force extraction into a specific folder

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mediashareminimal'
          slot-name: 'Production'
          package: ./deploy-package # ✅ Tell Azure to deploy the CONTENTS of this folder
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0FA04866BD3445DBA23195F50B17AADB }}
