name: Build and deploy Node.js app to Azure Web App - mediashareminimal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Prepare Package
        run: |
          # 1. Create a clean folder
          mkdir -p output
          
          # 2. Copy standalone files (server.js and its node_modules)
          # The trailing /. is important to copy contents, not the folder itself
          cp -r .next/standalone/. output/
          
          # 3. Copy static assets into the .next folder structure
          mkdir -p output/.next/static
          cp -r .next/static/. output/.next/static/
          cp -r public output/public

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: output
          include-hidden-files: true # ✅ Required for the .next folder

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          # No path set here ensures it downloads to the current workspace root

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mediashareminimal'
          slot-name: 'Production'
          package: . # ✅ Deploys the current directory contents directly to Azure
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0FA04866BD3445DBA23195F50B17AADB }}
