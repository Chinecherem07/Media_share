name: Build and deploy Node.js app to Azure Web App - mediashareminimal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Prepare Package
        run: |
          mkdir -p release
          cp -r .next/standalone/. release/
          mkdir -p release/.next/static
          cp -r .next/static/. release/.next/static/
          cp -r public release/public

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release
          include-hidden-files: true # ✅ Include .next

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: release

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mediashareminimal'
          package: release # ✅ Deploy only necessary files
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0FA04866BD3445DBA23195F50B17AADB }}
